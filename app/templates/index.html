<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Helm Chart Version Dashboard | NSF NCAR CISL</title>
    <meta property="og:title" content="Helm Chart Version Dashboard | NCAR CISL"/>
    <meta property="og:site_name" content="ncar_helm_dashboard"/>
    <meta property="og:type" content="website"/>
    
    <!-- External CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-T3c6CoIi6uLrA9TneNEoa7RxnatzjcDSCmG1MXxSR1GAsXEV/Dwwykc2MPK8M2HN" crossorigin="anonymous">
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <!-- Header Section -->
    <div class="header-section">
        <div class="header-content">
            <div class="logo-section">
                <img src="static/CIRRUS_Logo.png" class="logo" alt="NCAR CISL CIRRUS Logo">
            </div>
            <div class="title-section">
                <h1 class="main-title">Helm Chart Dashboard</h1>
                <div class="subtitle">Multi-Cluster Version Tracking</div>
            </div>
        </div>
    </div>

    <!-- Main Container -->
    <div class="container-main">
        <!-- Controls Section -->
        <div class="controls-section">
            <div class="controls-content">
                <div class="filters">
                    <div class="cluster-filter">
                        <label for="clusterFilter"><i class="fas fa-filter"></i> Cluster:</label>
                        <select id="clusterFilter" onchange="onClusterChange(this.value)">
                            <option value="all">All clusters</option>
                        </select>
                    </div>
                    <div class="tier-filter">
                        <label for="tierFilter"><i class="fas fa-signal"></i> Status:</label>
                        <select id="tierFilter" onchange="onTierChange(this.value)">
                            <option value="all">All statuses</option>
                        </select>
                    </div>
                </div>
                <div class="last-update">
                    <i class="fas fa-clock"></i> Last updated: <span id="lastUpdate">Never</span>
                </div>
                <button class="refresh-btn" id="refreshBtn" onclick="refreshData()">
                    <span id="refreshText"><i class="fas fa-sync-alt"></i> Refresh</span>
                </button>
            </div>
        </div>

        <!-- Summary Cards -->
        <div class="summary-cards" id="summaryCards">
            <!-- Summary cards will be populated by JavaScript -->
        </div>

        <!-- Main Content -->
        <div id="content">
            <div class="loading">
                <div class="spinner"></div>
                <br><br>
                Loading chart data...
            </div>
        </div>
    </div>

    <!-- Diff Modal -->
    <div class="modal fade" id="diffModal" tabindex="-1" aria-hidden="true" aria-labelledby="diffModalTitle">
        <div class="modal-dialog modal-xl modal-dialog-scrollable">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="diffModalTitle"></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
                </div>
                <div class="modal-body">
                    <div id="diffVersionPicker" class="diff-picker"></div>
                    <div id="diffMeta" class="diff-meta"></div>
                    <div id="diffStatus"></div>
                    <pre id="diffOutput" class="diff-output"></pre>
                </div>
                <div class="modal-footer">
                    <div id="diffActions">
                        <button id="diffCopyBtn" type="button" class="diff-action-btn" onclick="copyDiff()">
                            <i class="fas fa-copy"></i> Copy
                        </button>
                        <button id="diffDownloadBtn" type="button" class="diff-action-btn" onclick="downloadDiff()">
                            <i class="fas fa-download"></i> Download
                        </button>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- External JavaScript -->
    <script src="https://kit.fontawesome.com/e08b5a6906.js" crossorigin="anonymous"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js" integrity="sha384-C6RzsynM9kWDrMNeT87bh95OGNyZPhcTNXj1NW7RuBCsyN/o0jlpcV8Qyq46cDfL" crossorigin="anonymous"></script>
    <script src="{{ url_for('static', filename='dashboard.js') }}"></script>
</body>
</html>
