apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ .Values.webapp.name }}-esos
  namespace: {{ .Release.Namespace }}
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: user-ro
    kind: SecretStore
  target:
    name: {{ .Values.webapp.name }}-esos
  data:
    # Both are required. The app refuses to start with one of the two OAuth variables
    # set and not the other, rather than falling back to an unauthenticated dashboard,
    # so a typo in either key here fails the deploy instead of opening it up.
    - secretKey: {{ .Values.oauth.secret.clientSecretKey }}
      remoteRef:
        key: {{ .Values.oauth.secret.secretPath }}
        property: {{ .Values.oauth.secret.clientSecretKey }}
    - secretKey: {{ .Values.oauth.secret.sessionKeyKey }}
      remoteRef:
        key: {{ .Values.oauth.secret.secretPath }}
        property: {{ .Values.oauth.secret.sessionKeyKey }}
